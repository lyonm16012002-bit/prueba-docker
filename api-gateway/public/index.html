<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | Panel Johan F. Soliz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>JOHAN <span class="brand-accent">SOLIZ</span></h1>
      <p class="sub">Panel de administración — clientes, evaluaciones, rutinas, pagos y asistencia.</p>

      <form id="loginForm">
        <label for="username">Usuario</label>
        <input type="text" id="username" required autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';

      try {
        var data = await api.login(username, password);
        localStorage.setItem('gymdb_token', data.token);
        localStorage.setItem('gymdb_username', data.username);
        localStorage.setItem('gymdb_role', data.role);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'No se pudo iniciar sesión';
      }
    });

    // Si ya hay sesión activa, entra directo al panel
    if (localStorage.getItem('gymdb_token')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
