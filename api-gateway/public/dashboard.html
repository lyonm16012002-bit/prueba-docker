<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel | Johan F. Soliz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">JOHAN <span class="brand-accent">SOLIZ</span></div>
      <nav id="sideNav">
        <button data-section="dashboard" class="active">Resumen</button>
        <button data-section="clientes">Clientes</button>
        <button data-section="evaluaciones">Evaluaciones</button>
        <button data-section="rutinas">Rutinas</button>
        <button data-section="pagos">Pagos</button>
        <button data-section="asistencia">Asistencia</button>
      </nav>
      <div class="user-box">
        Sesión: <strong id="userLabel">-</strong>
        <div class="role-badge" id="roleBadge">-</div>
        <div style="margin-top:0.8rem;">
          <button class="btn-outline btn-sm" onclick="api.logout()">Cerrar sesión</button>
        </div>
      </div>
    </aside>

    <main class="main" id="mainContent">
      <!-- El contenido se genera por JS -->
    </main>
  </div>

  <!-- Modal genérico para crear/editar registros -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalTitle">Registro</h3>
      <form id="modalForm">
        <div class="field-grid" id="modalFields"></div>
        <div class="error-msg" id="modalError"></div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
